name: Release kmspgp.jar

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: release-jar
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      KMSPGP_LAMBDA_FUNCTION_NAME: ${{ vars.KMSPGP_LAMBDA_FUNCTION_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set release metadata
        id: meta
        run: |
          shortsha="$(git rev-parse --short HEAD)"
          echo "shortsha=${shortsha}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${shortsha}"

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build kmspgp.jar
        run: ./kmspgp/build.sh

      - name: Name the release artifact
        run: cp dist/kmspgp.jar "dist/kmspgp-${{ steps.meta.outputs.shortsha }}.jar"

      - name: Check pinned public key
        run: ./verify.sh --check-pin keys/signing.pub.asc

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-kmspgp-release

      - name: Sign the JAR
        run: |
          ./dist/lambda-sign.sh \
            --function "$KMSPGP_LAMBDA_FUNCTION_NAME" \
            --version "${{ steps.meta.outputs.shortsha }}" \
            --environment github-release \
            "dist/kmspgp-${{ steps.meta.outputs.shortsha }}.jar" \
            "dist/kmspgp-${{ steps.meta.outputs.shortsha }}.jar.asc"

      - name: Verify the signature
        run: |
          ./verify.sh --pubkey keys/signing.pub.asc \
            "dist/kmspgp-${{ steps.meta.outputs.shortsha }}.jar.asc" \
            "dist/kmspgp-${{ steps.meta.outputs.shortsha }}.jar"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          unset ${!AWS_*}
          gh release create "kmspgp-${{ steps.meta.outputs.shortsha }}" \
            --title "kmspgp ${{ steps.meta.outputs.shortsha }}" \
            --generate-notes \
            "dist/kmspgp-${{ steps.meta.outputs.shortsha }}.jar" \
            "dist/kmspgp-${{ steps.meta.outputs.shortsha }}.jar.asc"
